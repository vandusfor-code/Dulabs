    categoria: "Integraciones"
    descripcion: "Integraciones con sistemas empresariales (CRM, ERP, herramientas internas)."
    problema_que_resuelve: "Conectar DuLabs con sistemas que el negocio ya usa."
    cliente_ideal: "Negocios con CRM/ERP/sistemas internos que quieren conectar con DuLabs."
    funcionalidades: []
