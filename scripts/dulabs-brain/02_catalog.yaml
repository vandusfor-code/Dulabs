    categoria: "Automatizacion"
    descripcion: "Automatizacion de procesos empresariales mas alla de la atencion por WhatsApp."
    problema_que_resuelve: "Procesos manuales repetitivos que el negocio quiere automatizar."
    cliente_ideal: "Negocios con procesos internos especificos a automatizar."
