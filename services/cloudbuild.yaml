# DuLabs Developer V1 -- Fase 3. Config de Cloud Build reusable para los 4
# servicios (parametrizado por sustitución, en vez de 4 archivos casi
# idénticos). Uso:
#   gcloud builds submit --config=services/cloudbuild.yaml \
#     --substitutions=_DOCKERFILE=services/gateway/Dockerfile,_IMAGE=us-central1-docker.pkg.dev/dulabs-developer-v1/dulabs-developer/gateway:<tag> \
#     --project=dulabs-developer-v1 .
steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-f", "${_DOCKERFILE}", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
